<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Language Chunks · Version 0.7</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Yu Gothic',Meiryo,sans-serif;background:#edf5f8;color:#29475b;padding:28px 15px}main{max-width:760px;margin:auto}header{text-align:center;margin-bottom:24px}h1{color:#287a98;margin-bottom:6px}h2{font-size:1.18rem;margin-top:0}.panel{background:#fff;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 4px 15px #00000010}label{display:block;font-weight:bold;margin:14px 0 6px}input,select{width:100%;font:inherit;padding:12px;border:1px solid #b8d1dd;border-radius:10px;background:#fff;color:#29475b}button{background:#287a98;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}button:hover{background:#1c5f77}.secondary{background:#e9f2f5;color:#29475b}.secondary:hover{background:#d6e7ed}.toolbar,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{justify-content:flex-start}.toolbar select{width:auto}.chunk{border-top:1px solid #e1edf1;padding:17px 0}.chunk p{margin:8px 0;overflow-wrap:anywhere}.lang{font-size:.82rem;color:#47778a}.empty,.hint{color:#6c8490}.status{display:inline-block;background:#e9f2f5;border-radius:20px;padding:5px 10px;font-size:.83rem;margin:8px 0}.question{font-size:1.4rem;font-weight:bold;text-align:center;margin:30px 0;overflow-wrap:anywhere}.answer{font-size:1.3rem;text-align:center;margin:24px 0;font-weight:bold;overflow-wrap:anywhere}footer{text-align:center;color:#718a96;font-size:.85rem;margin-top:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{margin-top:0}.hidden{display:none!important}.small{font-size:.85rem}.notice{background:#f2f8fb;border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:14px}@media(max-width:520px){.grid{grid-template-columns:1fr}.panel{padding:18px}.toolbar select{width:100%}}
</style></head><body><main>
<header><h1>My Language Chunks ✈️</h1><p>Every day, a little progress.</p></header>
<section class="panel"><h2>新しいチャンクを登録</h2><form id="chunkForm"><label for="language">言語</label><select id="language"><option value="en">🇺🇸 English (US)</option><option value="de">🇩🇪 Deutsch</option></select><label for="expression">単語・チャンク</label><input id="expression" required maxlength="500" placeholder="例：What matters is to keep trying."><label for="translation">日本語訳</label><input id="translation" required maxlength="500" placeholder="例：大切なのは挑戦し続けること。"><p><button type="submit">＋ 登録する</button></p></form></section>
<section class="panel"><h2>復習モード</h2><div class="grid"><div><label for="reviewSet">復習する表現</label><select id="reviewSet"><option value="pending">通常の復習（復習が必要）</option><option value="learned">覚えた表現の復習</option><option value="all">すべて復習</option></select></div><div><label for="reviewLang">復習する言語</label><select id="reviewLang"><option value="all">すべて</option><option value="en">🇺🇸 English (US)</option><option value="de">🇩🇪 Deutsch</option></select></div></div><label for="direction">出題方法</label><select id="direction"><option value="ja">日本語 → 英語・ドイツ語</option><option value="foreign">英語・ドイツ語 → 日本語</option><option value="random">ランダム（両方向）</option></select><p class="hint small">覚えた表現は通常の復習には出ません。必要なときに選んで復習できます。</p><button id="start" type="button">復習を始める</button><div id="review" aria-live="polite"></div></section>
<section class="panel"><div class="toolbar"><h2>登録した表現 <span id="count">(0)</span></h2><select id="filter" aria-label="言語で絞り込み"><option value="all">すべて</option><option value="en">🇺🇸 English (US)</option><option value="de">🇩🇪 Deutsch</option></select></div><div id="list"></div><div class="notice">データはこのブラウザ内に保存されます。別のブラウザや端末には自動同期されません。</div></section><section class="panel"><h2>データのバックアップ</h2><p class="hint small">登録した表現と学習状況をファイルに保存できます。定期的なバックアップをおすすめします。</p><div class="actions"><button id="exportData" type="button">⬇ バックアップを保存</button><button id="importData" type="button" class="secondary">⬆ バックアップから復元</button></div><input id="backupFile" type="file" accept=".json,application/json" class="hidden" aria-label="バックアップファイルを選択"><p id="backupMessage" class="hint small" aria-live="polite"></p></section><footer>My Language Chunks · Version 0.7</footer></main>
<script>
'use strict';
const KEY='my-language-chunks-v1';
const $=id=>document.getElementById(id);
let chunks=[],queue=[],position=0,revealed=false,activeDirection='ja',storageOk=true;
try{const raw=localStorage.getItem(KEY);const parsed=JSON.parse(raw||'[]');if(Array.isArray(parsed)){chunks=parsed.filter(x=>x&&typeof x.text==='string'&&typeof x.ja==='string'&&['en','de'].includes(x.lang)).map((x,i)=>({...x,id:x.id||'legacy-'+i,learned:x.learned===true||x.status==='learned'||x.mastered===true||x.remembered===true}));}else throw Error('invalid');}catch(e){storageOk=false;alert('保存データを読み込めませんでした。既存データを守るため、登録・変更を停止しています。');}
function save(next){if(!storageOk)return false;try{localStorage.setItem(KEY,JSON.stringify(next));chunks=next;return true}catch(e){alert('保存できませんでした。ブラウザの保存設定をご確認ください。');return false}}
function node(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function btn(txt,fn,secondary=false){const b=node('button',txt,secondary?'secondary':'');b.type='button';b.addEventListener('click',fn);return b}
function label(lang){return lang==='en'?'🇺🇸 English (US)':'🇩🇪 Deutsch'}
function speak(item){if(!('speechSynthesis'in window)){alert('このブラウザは音声読み上げに対応していません。');return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(item.text);utter.lang=item.lang==='en'?'en-US':'de-DE';utter.rate=.9;speechSynthesis.speak(utter)}
function changeLearned(item,value){if(save(chunks.map(x=>x.id===item.id?{...x,learned:value}:x))){render();}}
function render(){const list=$('list');list.replaceChildren();$('count').textContent=`(${chunks.length})`;const visible=chunks.filter(x=>$('filter').value==='all'||x.lang===$('filter').value);if(!visible.length){list.append(node('p','まだ表示するチャンクがありません。','empty'));return}visible.slice().reverse().forEach(item=>{const a=node('article',undefined,'chunk');a.append(node('div',label(item.lang),'lang'),node('p',item.text),node('p',item.ja),node('div',item.learned?'✓ 覚えた':'↻ 復習が必要','status'));const actions=node('div',undefined,'actions');actions.append(btn('🔊 発音を聞く',()=>speak(item)));actions.append(btn(item.learned?'↻ 復習が必要に戻す':'✓ 覚えた',()=>changeLearned(item,!item.learned),true));actions.append(btn('削除',()=>{if(confirm('このチャンクを削除しますか？')){if(save(chunks.filter(x=>x.id!==item.id)))render()}},true));a.append(actions);list.append(a)})}
$('chunkForm').addEventListener('submit',e=>{e.preventDefault();const text=$('expression').value.trim(),ja=$('translation').value.trim();if(!text||!ja)return;const id=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const next=[...chunks,{id,lang:$('language').value,text,ja,learned:false}];if(save(next)){$('expression').value='';$('translation').value='';render();$('expression').focus()}});
$('filter').addEventListener('change',render);
function start(){const type=$('reviewSet').value,lang=$('reviewLang').value;queue=chunks.filter(x=>(lang==='all'||x.lang===lang)&&(type==='all'||(type==='learned'?x.learned:!x.learned))).map(x=>x.id);for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}position=0;showQuestion()}
function showQuestion(){const area=$('review');area.replaceChildren();if(position>=queue.length){area.append(node('p',queue.length?'お疲れさまでした！今回の復習は終了です 🌷':'該当する表現はありません。','hint'));return}const item=chunks.find(x=>x.id===queue[position]);if(!item){position++;showQuestion();return}revealed=false;activeDirection=$('direction').value; if(activeDirection==='random')activeDirection=Math.random()<.5?'ja':'foreign';area.append(node('p',`${position+1} / ${queue.length} · ${label(item.lang)} · ${activeDirection==='ja'?'日本語 → 外国語':'外国語 → 日本語'}`,'hint'));area.append(node('div',activeDirection==='ja'?item.ja:item.text,'question'));const controls=node('div',undefined,'actions');controls.append(btn('答えを見る',()=>showAnswer(item)));area.append(controls)}
function showAnswer(item){if(revealed)return;revealed=true;const area=$('review');area.append(node('div',activeDirection==='ja'?item.text:item.ja,'answer'));const actions=node('div',undefined,'actions');actions.append(btn('🔊 発音を聞く',()=>speak(item)));actions.append(btn('↻ もう一度復習',()=>{if(!save(chunks.map(x=>x.id===item.id?{...x,learned:false}:x)))return;render();position++;showQuestion()},true));actions.append(btn('✓ 覚えた',()=>{if(!save(chunks.map(x=>x.id===item.id?{...x,learned:true}:x)))return;render();position++;showQuestion()},true));area.append(actions)}
$('exportData').addEventListener('click',()=>{if(!storageOk){alert('保存データを安全に読み込めていないため、バックアップできません。');return}const payload={app:'My Language Chunks',version:1,exportedAt:new Date().toISOString(),chunks};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-language-chunks-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('backupMessage').textContent='バックアップファイルを保存しました。ダウンロードフォルダをご確認ください。'});
$('importData').addEventListener('click',()=>{if(!storageOk){alert('現在の保存データを読み込めないため、復元を停止しています。');return}$('backupFile').value='';$('backupFile').click()});
$('backupFile').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('ファイルが大きすぎます（上限5MB）。');const parsed=JSON.parse(await file.text());if(!parsed||parsed.app!=='My Language Chunks'||parsed.version!==1||!Array.isArray(parsed.chunks))throw Error('このアプリのバックアップファイルではありません。');const restored=parsed.chunks.map((x,i)=>{if(!x||typeof x.text!=='string'||typeof x.ja!=='string'||!['en','de'].includes(x.lang)||!x.text.trim()||!x.ja.trim()||x.text.length>500||x.ja.length>500)throw Error('バックアップの内容が正しくありません。');return {id:typeof x.id==='string'&&x.id?x.id:'restored-'+i,lang:x.lang,text:x.text,ja:x.ja,learned:x.learned===true}});if(restored.length>10000)throw Error('登録件数が多すぎます。');const ids=new Set(restored.map(x=>x.id));if(ids.size!==restored.length)throw Error('重複するIDがあります。');if(!confirm('現在の登録データ '+chunks.length+' 件を、バックアップの '+restored.length+' 件で置き換えます。現在のデータは上書きされます。続けますか？'))return;if(save(restored)){queue=[];position=0;$('review').replaceChildren();render();$('backupMessage').textContent='復元しました（'+restored.length+' 件）。'}}catch(err){alert('復元できませんでした。'+err.message)}finally{e.target.value=''}});
$('start').addEventListener('click',start);render();
</script></body></html>
